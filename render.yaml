services:
  - type: web
    name: partsense
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && pip install -e ."
    startCommand: "streamlit run app/Home.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
    plan: free

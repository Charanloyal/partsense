[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "partsense"
version = "0.1.0"
description = "PartSense: Spare Part Failure Prediction & Warranty Analytics Platform"
authors = [
    {name = "Charan Kumar Reddy", email = "charan.workmaill@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "xgboost>=2.0.0",
    "duckdb>=0.10.0",
    "ucimlrepo>=0.0.7",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "shap>=0.45.0",
    "pyyaml>=6.0.1",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "invoke>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["partsense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
norecursedirs = [".venv", "venv", "build", "dist", ".git", "__pycache__"]
addopts = "-v --strict-markers"
